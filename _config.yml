# تنظیمات اصلی سایت
title: "FinoMax Mini App"
description: "Smart Investment Platform for Telegram - Mine USDT, Play Games, Earn Rewards"
url: "https://YOUR-USERNAME.github.io"
baseurl: "/finomax-miniapp"

# اطلاعات سازنده
author:
  name: "FinoMax Team"
  email: "support@finomax.com"
  url: "https://finomax.com"

# تنظیمات زبان
lang: en
locale: en_US

# تنظیمات GitHub Pages
github:
  repository_url: "https://github.com/YOUR-USERNAME/finomax-miniapp"
  repository_name: "finomax-miniapp"

# پلاگین‌های Jekyll
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# تنظیمات SEO
seo:
  type: WebApplication
  name: "FinoMax"
  headline: "Smart Investment Platform"
  description: "Mine USDT, play games, and earn rewards in this Telegram mini app"
  image: "https://YOUR-USERNAME.github.io/finomax-miniapp/logo.png"

# تنظیمات امنیتی
safe: true
incremental: false
highlighter: rouge
gist:
  noscript: false

# فایل‌های مستثنی
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - .github/
  - node_modules/
  - package*.json

# تنظیمات Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# تنظیمات فید RSS
feed:
  posts_limit: 10
  excerpt_only: true

# تنظیمات Sitemap
sitemap:
  priority: 1.0
  changefreq: 'daily'
  lastmod: 2024-01-01

# متغیرهای سفارشی
app:
  version: "1.0.0"
  telegram_bot: "@finomaxinvest_bot"
  support_url: "https://t.me/finomax_support"
  
# تنظیمات Analytics
google_analytics: "GA_MEASUREMENT_ID"

قدم ۲: ایجاد فایل robots.txt
"Add file" > "Create new file"
نام فایل: robots.txt
محتوای فایل:
User-agent: *
Allow: /

# Sitemap
Sitemap: https://YOUR-USERNAME.github.io/finomax-miniapp/sitemap.xml

# اجازه دسترسی به فایل‌های مهم
Allow: /index.html
Allow: /telegram.js
Allow: /*.css
Allow: /*.js
Allow: /*.png
Allow: /*.jpg
Allow: /*.svg

# منع دسترسی به فایل‌های حساس
Disallow: /.git/
Disallow: /.github/
Disallow: /node_modules/

# تنظیمات برای موتورهای جستجو
Crawl-delay: 1

قدم ۳: ایجاد فایل manifest.json
"Add file" > "Create new file"
نام فایل: manifest.json
محتوای فایل:
{
  "name": "FinoMax - Smart Investment Platform",
  "short_name": "FinoMax",
  "description": "Mine USDT, play games, and earn rewards in this Telegram mini app",
  "version": "1.0.0",
  "start_url": "/",
  "display": "standalone",
  "orientation": "portrait",
  "theme_color": "#1a1a3a",
  "background_color": "#0a0a1a",
  "lang": "en",
  "scope": "/",
  "icons": [
    {
      "src": "icon-192.png",
      "sizes": "192x192",
      "type": "image/png",
      "purpose": "any maskable"
    },
    {
      "src": "icon-512.png", 
      "sizes": "512x512",
      "type": "image/png",
      "purpose": "any maskable"
    }
  ],
  "categories": ["finance", "games", "productivity"],
  "screenshots": [
    {
      "src": "screenshot1.png",
      "sizes": "540x720",
      "type": "image/png"
    }
  ],
  "shortcuts": [
    {
      "name": "Start Mining",
      "short_name": "Mine",
      "description": "Start mining USDT",
      "url": "/?action=mining",
      "icons": [
        {
          "src": "mining-icon.png",
          "sizes": "96x96"
        }
      ]
    },
    {
      "name": "Play Games",
      "short_name": "Games", 
      "description": "Play games and win rewards",
      "url": "/?action=games",
      "icons": [
        {
          "src": "games-icon.png",
          "sizes": "96x96"
        }
      ]
    }
  ],
  "related_applications": [
    {
      "platform": "telegram",
      "url": "https://t.me/finomaxinvest_bot"
    }
  ],
  "prefer_related_applications": true
}
